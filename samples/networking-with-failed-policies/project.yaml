apiVersion: magosproject.io/v1alpha1
kind: Project
metadata:
  name: networking-with-failed-policies
  namespace: default
spec:
  description: Cloud Networking Platform
  validation:
    policySelector:
      matchExpressions:
        - key: policy.magosproject.io/category
          operator: In
          values:
            - network-security-1
            - network-security-2
