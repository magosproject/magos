apiVersion: magosproject.io/v1alpha1
kind: Workspace
metadata:
  name: edge-dev
  namespace: default
  labels:
    env: dev
spec:
  projectRef:
    name: cdn-platform
  serviceAccountName: magos-job
  source:
    repoURL: https://github.com/magosproject/demo.git
    targetRevision: main
    path: .
  terraform:
    version: "1.14.8"
    tfvarsPath: env/dev/vars.tfvars
