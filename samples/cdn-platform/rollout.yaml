apiVersion: magosproject.io/v1alpha1
kind: Rollout
metadata:
  name: cdn-platform # Must match the projectRef exactly due to our CEL validation rule!
  namespace: default
spec:
  projectRef: cdn-platform
  strategy:
    steps:
      # Step 1: single dev workspace
      - name: dev
        selector:
          matchLabels:
            env: dev
      # Step 2: both staging regions run in parallel (selector matches two workspaces)
      - name: staging
        selector:
          matchLabels:
            env: staging
      # Step 3: canary — single prod region before committing globally
      - name: prod-canary
        selector:
          matchLabels:
            env: prod
            tier: canary
      # Step 4: remaining prod regions run in parallel (selector matches two workspaces)
      - name: prod-global
        selector:
          matchLabels:
            env: prod
            tier: global
