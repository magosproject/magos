apiVersion: magosproject.io/v1alpha1
kind: Workspace
metadata:
  name: edge-us-east-prod
  namespace: default
  labels:
    env: prod
    tier: canary
    region: us-east
spec:
  projectRef:
    name: cdn-platform
  serviceAccountName: magos-job
  source:
    repoURL: https://github.com/magosproject/demo.git
    targetRevision: main
    path: .
  terraform:
    version: "1.14.8"
    tfvarsPath: env/prod/vars.tfvars
