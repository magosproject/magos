# Sample Secret representing a database admin password that is provisioned and
# rotated by an external secret manager (External Secrets Operator, sealed
# secrets, Vault Agent, etc.) and consumed by a Terraform module that provisions a
# managed database.
apiVersion: v1
kind: Secret
metadata:
  name: networking-db-admin
  namespace: default
type: Opaque
stringData:
  password: replace-me-with-a-rotated-secret
