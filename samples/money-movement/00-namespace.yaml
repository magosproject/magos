apiVersion: v1
kind: Namespace
metadata:
  name: money-movement
  labels:
    app.kubernetes.io/part-of: money-movement-platform
    app.kubernetes.io/managed-by: magos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magos-job
  namespace: money-movement
  labels:
    app.kubernetes.io/part-of: money-movement-platform
    app.kubernetes.io/managed-by: magos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
