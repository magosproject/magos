    app.kubernetes.io/part-of: money-movement-platform
    app.kubernetes.io/managed-by: magos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: magos-job
subjects:
- kind: ServiceAccount
  name: magos-job
  namespace: money-movement
