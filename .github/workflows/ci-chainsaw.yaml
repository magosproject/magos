name: ci-chainsaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.4.0
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'go.mod', 'go.sum') }}

      # TODO: pin all GHA versions on sha instead of tag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build controller image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: controller:local
          load: true
          cache-from: type=gha,scope=chainsaw-controller
          cache-to: type=gha,mode=max,scope=chainsaw-controller

      - name: Build job image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/job/Dockerfile
          tags: magos-job:local
          load: true
          cache-from: type=gha,scope=chainsaw-job
          cache-to: type=gha,mode=max,scope=chainsaw-job

      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          tags: magos-api:local
          load: true
          cache-from: type=gha,scope=chainsaw-api
          cache-to: type=gha,mode=max,scope=chainsaw-api

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: magos-chainsaw
          wait: 120s

      - name: Load images into kind
        run: |
          kind load docker-image controller:local --name magos-chainsaw
          kind load docker-image magos-job:local --name magos-chainsaw
          kind load docker-image magos-api:local --name magos-chainsaw

      - name: Install magos chart
        run: |
          helm upgrade --install magos charts/magos/ \
            --namespace magos-system --create-namespace \
            --set image.repository=controller \
            --set image.tag=local \
            --set image.pullPolicy=Never \
            --set jobImage.repository=magos-job \
            --set jobImage.tag=local \
            --set jobImage.pullPolicy=Never \
            --set ui.enabled=false \
            --set api.image.repository=magos-api \
            --set api.image.tag=local \
            --set api.image.pullPolicy=Never \
            --wait --timeout=5m

      - name: Install chainsaw
        run: make chainsaw

      - name: Run chainsaw tests
        run: make test-chainsaw

      - name: Run chart chainsaw tests
        run: make test-chainsaw-chart
