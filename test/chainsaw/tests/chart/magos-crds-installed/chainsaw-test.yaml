apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: magos-crds-installed
spec:
  description: Asserts the four magosproject.io CRDs are installed.
  steps:
  - try:
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: workspaces.magosproject.io
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: projects.magosproject.io
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: rollouts.magosproject.io
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: variablesets.magosproject.io
