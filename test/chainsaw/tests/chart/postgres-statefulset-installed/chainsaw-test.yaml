apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: postgres-statefulset-installed
spec:
  description: Asserts the bundled Postgres StatefulSet is ready.
  steps:
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: magos-postgres
            namespace: magos-system
          spec:
            serviceName: magos-postgres-headless
          status:
            readyReplicas: 1
