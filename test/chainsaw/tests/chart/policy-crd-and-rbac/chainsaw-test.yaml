apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policy-crd-and-rbac
spec:
  description: |
    Asserts that a chart install creates the
    policies.kyverno.io ValidatingPolicy CRD, the magos-job
    ServiceAccount, and the ClusterRole and ClusterRoleBinding that
    grant the ServiceAccount get/list/watch on validatingpolicies.
  steps:
  - try:
    - assert:
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: magos-job
            namespace: magos-system
    - assert:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: magos-job
          rules:
          - apiGroups:
            - policies.kyverno.io
            resources:
            - validatingpolicies
            verbs:
            - get
            - list
            - watch
    - assert:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: magos-job
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: magos-job
          subjects:
          - kind: ServiceAccount
            name: magos-job
            namespace: magos-system
    - apply:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: policy-crd-probe
          spec:
            evaluation:
              mode: JSON
            matchConditions:
            - name: is-terraform-plan
              expression: 'has(object.planned_values) && has(object.terraform_version)'
            validations:
            - message: 'probe policy: always passes'
              expression: 'true'
    - assert:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: policy-crd-probe
