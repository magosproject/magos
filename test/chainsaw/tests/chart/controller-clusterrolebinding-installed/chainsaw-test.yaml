apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: controller-clusterrolebinding-installed
spec:
  description: Asserts the controller ClusterRoleBinding subjects every controller SA.
  steps:
  - try:
    - assert:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: magos
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: magos
          subjects:
          - kind: ServiceAccount
            name: magos-workspace
            namespace: magos-system
          - kind: ServiceAccount
            name: magos-project
            namespace: magos-system
          - kind: ServiceAccount
            name: magos-rollout
            namespace: magos-system
          - kind: ServiceAccount
            name: magos-variableset
            namespace: magos-system
          - kind: ServiceAccount
            name: magos-refwatcher
            namespace: magos-system
