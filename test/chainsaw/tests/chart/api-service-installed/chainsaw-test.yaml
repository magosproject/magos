apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: api-service-installed
spec:
  description: Asserts the API Service exposes the http port over ClusterIP.
  steps:
  - try:
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: magos-api
            namespace: magos-system
          spec:
            type: ClusterIP
            ports:
            - name: http
              port: 80
              targetPort: http
              protocol: TCP
