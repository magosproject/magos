apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: managed-by-rollout
spec:
  description: |
    Asserts that a Project with a Rollout of the same name reaches
    phase=Ready with reason=ManagedByRollout.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: managed-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: managed-project
          spec:
            projectRef: managed-project
            strategy:
              steps: []
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: managed-project
          status:
            phase: Ready
            reason: ManagedByRollout
            conditions:
            - type: Ready
              status: "True"
              reason: ManagedByRollout
