apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deletion
spec:
  description: |
    Asserts that deleting a Project removes its finalizer and the
    object is fully reaped.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: delete-project
          spec: {}
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: delete-project
            finalizers:
            - magosproject.io/finalizer
    - delete:
        ref:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          name: delete-project
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: delete-project
