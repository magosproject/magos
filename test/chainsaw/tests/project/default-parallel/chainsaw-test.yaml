apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: default-parallel
spec:
  description: |
    Asserts that a Project with no matching Rollout reaches
    phase=Ready with reason=DefaultParallel and grants
    magosproject.io/execution-allowed=true to each Workspace that
    references it.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: default-parallel-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: default-parallel-ws
          spec:
            projectRef:
              name: default-parallel-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: default-parallel-project
          status:
            phase: Ready
            reason: DefaultParallel
            conditions:
            - type: Ready
              status: "True"
              reason: DefaultParallel
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: default-parallel-ws
            annotations:
              magosproject.io/execution-allowed: "true"
