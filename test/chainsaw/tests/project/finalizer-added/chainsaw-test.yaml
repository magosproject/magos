apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: finalizer-added
spec:
  description: |
    Asserts that a newly created Project has the
    magosproject.io/finalizer set by the controller.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: finalizer-project
          spec: {}
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: finalizer-project
            finalizers:
            - magosproject.io/finalizer
