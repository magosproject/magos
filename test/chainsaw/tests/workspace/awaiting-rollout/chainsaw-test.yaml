apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: awaiting-rollout
spec:
  description: |
    Asserts that a Workspace whose Project does not exist stays in
    phase=Pending with reason=AwaitingRollout.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: orphan-ws
          spec:
            projectRef:
              name: nonexistent-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: orphan-ws
          status:
            phase: Pending
            reason: AwaitingRollout
