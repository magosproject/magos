apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deletion
spec:
  description: |
    Asserts that deleting a Workspace removes its finalizer and the
    object is fully reaped.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: delete-ws
          spec:
            projectRef:
              name: ghost-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: delete-ws
            finalizers:
            - magosproject.io/finalizer
    - delete:
        ref:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          name: delete-ws
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: delete-ws
