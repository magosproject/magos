apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reject-missing-repourl
spec:
  description: |
    Asserts that the API server rejects a Workspace without
    spec.source.repoURL.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: missing-repourl
          spec:
            projectRef:
              name: some-project
            source:
              targetRevision: main
            terraform:
              version: "1.14.8"
        expect:
        - match:
            apiVersion: magosproject.io/v1alpha1
            kind: Workspace
          check:
            ($error != null): true
