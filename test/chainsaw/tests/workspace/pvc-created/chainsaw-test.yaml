apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pvc-created
spec:
  description: |
    Asserts that the workspace controller creates a
    PersistentVolumeClaim named `<workspace>-data` and sets a
    controller owner reference back to the Workspace.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: pvc-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: pvc-ws
          spec:
            projectRef:
              name: pvc-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: pvc-ws-data
            ownerReferences:
            - apiVersion: magosproject.io/v1alpha1
              kind: Workspace
              name: pvc-ws
              controller: true
          spec:
            accessModes:
            - ReadWriteOnce
