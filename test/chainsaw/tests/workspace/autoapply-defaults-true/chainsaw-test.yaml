apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: autoapply-defaults-true
spec:
  description: |
    Asserts that a Workspace created without spec.autoApply has
    the field defaulted to true by the CRD schema.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: autoapply-default
          spec:
            projectRef:
              name: no-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: autoapply-default
          spec:
            autoApply: true
