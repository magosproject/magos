apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: serviceaccount-default
spec:
  description: |
    Asserts that a Workspace created without
    spec.serviceAccountName has the field defaulted to "magos-job"
    by the CRD schema.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: sa-default-ws
          spec:
            projectRef:
              name: no-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: sa-default-ws
          spec:
            serviceAccountName: magos-job
