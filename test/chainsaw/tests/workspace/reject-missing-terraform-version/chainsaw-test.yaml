apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reject-missing-terraform-version
spec:
  description: |
    Asserts that the API server rejects a Workspace without
    spec.terraform.version.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: missing-tf-version
          spec:
            projectRef:
              name: some-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform: {}
        expect:
        - match:
            apiVersion: magosproject.io/v1alpha1
            kind: Workspace
          check:
            ($error != null): true
