apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reject-empty-projectref
spec:
  description: |
    Asserts that the API server rejects a Workspace with an empty
    spec.projectRef.name.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: empty-projectref
          spec:
            projectRef:
              name: ""
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
        expect:
        - match:
            apiVersion: magosproject.io/v1alpha1
            kind: Workspace
          check:
            ($error != null): true
