apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: approval-required-autoapply-false
spec:
  description: |
    Asserts that a Workspace with spec.autoApply=false parks in Planned
    after a successful plan, then progresses to Applying when the
    magosproject.io/approval-decision=approved annotation is set and the
    decision annotation is consumed by the controller.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: approve-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: approve-ws
            annotations:
              magosproject.io/execution-allowed: "true"
          spec:
            projectRef:
              name: approve-project
            autoApply: false
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
              path: .
            terraform:
              version: "1.14.8"
            serviceAccountName: magos-job
    # Wait for the controller to create the plan Job.
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            labels:
              magosproject.io/workspace: approve-ws
              magosproject.io/job-type: plan
    # Force the plan Job to terminal success.
    - script:
        content: |
          set -euo pipefail
          job_name=$(kubectl get jobs -n "$NAMESPACE" \
            -l magosproject.io/workspace=approve-ws,magosproject.io/job-type=plan \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$job_name" ]; then
            echo "plan job not found"
            exit 1
          fi
          kubectl patch job "$job_name" -n "$NAMESPACE" \
            --subresource=status --type merge \
            -p '{"status":{"succeeded":1,"completionTime":"2026-05-21T00:00:00Z","conditions":[{"type":"Complete","status":"True","lastTransitionTime":"2026-05-21T00:00:00Z","reason":"Completed","message":"plan completed"}]}}'
    # Without an approval annotation the Workspace must park in Planned.
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: approve-ws
          status:
            phase: Planned
            reason: PlanSucceeded
    # Approve via the decision annotation.
    - script:
        content: |
          set -euo pipefail
          kubectl annotate workspace approve-ws -n "$NAMESPACE" \
            magosproject.io/approval-decision=approved --overwrite
    # The controller consumes the annotation and creates the Apply Job.
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            labels:
              magosproject.io/workspace: approve-ws
              magosproject.io/job-type: apply
    # The Workspace must have moved to Applying.
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: approve-ws
          status:
            phase: Applying
    # The decision annotation must be consumed (deleted) by the controller.
    - script:
        content: |
          set -euo pipefail
          val=$(kubectl get workspace approve-ws -n "$NAMESPACE" \
            -o jsonpath='{.metadata.annotations.magosproject\.io/approval-decision}')
          if [ -n "$val" ]; then
            echo "approval-decision annotation was not consumed; got: $val"
            exit 1
          fi
