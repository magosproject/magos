apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: finalizer-added
spec:
  description: |
    Asserts that a newly created Workspace has the
    magosproject.io/finalizer set by the controller.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: finalizer-ws
          spec:
            projectRef:
              name: does-not-exist
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: finalizer-ws
            finalizers:
            - magosproject.io/finalizer
