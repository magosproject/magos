apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reconcile-interval-honored
spec:
  description: |
    Asserts that a Workspace with a
    magosproject.io/reconcile-interval annotation has a non-null
    status.nextReconcileTime, proving the controller honored the
    annotation and ran its schedule bookkeeping.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: custom-interval-ws
            annotations:
              magosproject.io/reconcile-interval: "45m"
          spec:
            projectRef:
              name: no-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: custom-interval-ws
            annotations:
              magosproject.io/reconcile-interval: "45m"
          status:
            phase: Pending
            reason: AwaitingRollout
            (nextReconcileTime != null): true
