apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: no-workspaces-found
spec:
  description: |
    Asserts that a Rollout whose first step selector matches zero
    Workspaces reaches phase=Failed with reason=NoWorkspacesFound.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: no-ws-rollout
          spec:
            projectRef: no-ws-rollout
            strategy:
              steps:
              - name: dev
                selector:
                  matchLabels:
                    env: dev
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: no-ws-rollout
          status:
            phase: Failed
            reason: NoWorkspacesFound
            currentStep: 0
            conditions:
            - type: Ready
              status: "False"
              reason: NoWorkspacesFound
