apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cross-project-isolation
spec:
  description: |
    Asserts that a Rollout only grants execution-allowed=true to
    Workspaces whose spec.projectRef matches its own projectRef,
    even when other Workspaces in the namespace match the same
    label selector.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: owned-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: owned-ws
            labels:
              env: shared
          spec:
            projectRef:
              name: owned-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: stranger-ws
            labels:
              env: shared
          spec:
            projectRef:
              name: unknown-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: owned-project
          spec:
            projectRef: owned-project
            strategy:
              steps:
              - name: shared
                selector:
                  matchLabels:
                    env: shared
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: owned-ws
            annotations:
              magosproject.io/execution-allowed: "true"
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: stranger-ws
          status:
            phase: Pending
            reason: AwaitingRollout
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: stranger-ws
            annotations:
              magosproject.io/execution-allowed: "true"
