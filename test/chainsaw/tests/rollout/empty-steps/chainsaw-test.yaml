apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: empty-steps
spec:
  description: |
    Asserts that a Rollout with an empty strategy.steps list
    reaches phase=Ready with reason=NoSteps.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: empty-steps-rollout
          spec:
            projectRef: empty-steps-rollout
            strategy:
              steps: []
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: empty-steps-rollout
          status:
            phase: Ready
            reason: NoSteps
            conditions:
            - type: Ready
              status: "True"
              reason: NoSteps
