apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: step-ordering
spec:
  description: |
    Asserts that a Rollout with two sequential steps grants
    execution-allowed=true to the step-0 Workspace, leaves the
    step-1 Workspace without it, and keeps status.currentStep at 0.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: ordering-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: first
            labels:
              tier: one
          spec:
            projectRef:
              name: ordering-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: second
            labels:
              tier: two
          spec:
            projectRef:
              name: ordering-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: ordering-project
          spec:
            projectRef: ordering-project
            strategy:
              steps:
              - name: one
                selector:
                  matchLabels:
                    tier: one
              - name: two
                selector:
                  matchLabels:
                    tier: two
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: ordering-project
          status:
            currentStep: 0
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: first
            annotations:
              magosproject.io/execution-allowed: "true"
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: second
            annotations:
              magosproject.io/execution-allowed: "true"
