apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic-orchestration
spec:
  description: |
    Asserts that a Rollout with three sequential steps pins
    status.currentStep at 0, grants execution-allowed=true only to
    the step-0 Workspace, and leaves the step-1 and step-2
    Workspaces without that annotation.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Project
          metadata:
            name: seq-project
          spec: {}
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-dev
            labels:
              env: dev
          spec:
            projectRef:
              name: seq-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-staging
            labels:
              env: staging
          spec:
            projectRef:
              name: seq-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-prod
            labels:
              env: prod
          spec:
            projectRef:
              name: seq-project
            source:
              repoURL: https://example.invalid/repo.git
              targetRevision: main
            terraform:
              version: "1.14.8"
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: seq-project
          spec:
            projectRef: seq-project
            strategy:
              steps:
              - name: dev
                selector:
                  matchLabels:
                    env: dev
              - name: staging
                selector:
                  matchLabels:
                    env: staging
              - name: prod
                selector:
                  matchLabels:
                    env: prod
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: seq-project
          status:
            currentStep: 0
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-dev
            annotations:
              magosproject.io/execution-allowed: "true"
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-staging
            annotations:
              magosproject.io/execution-allowed: "true"
    - error:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Workspace
          metadata:
            name: seq-prod
            annotations:
              magosproject.io/execution-allowed: "true"
