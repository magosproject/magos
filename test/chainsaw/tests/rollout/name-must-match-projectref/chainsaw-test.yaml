apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: name-must-match-projectref
spec:
  description: |
    Asserts that the API server rejects a Rollout whose
    metadata.name does not equal spec.projectRef.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: Rollout
          metadata:
            name: wrong-name
          spec:
            projectRef: some-other-project
            strategy:
              steps:
              - name: dev
                selector:
                  matchLabels:
                    env: dev
        expect:
        - match:
            apiVersion: magosproject.io/v1alpha1
            kind: Rollout
          check:
            ($error != null): true
