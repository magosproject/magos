apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: missing-key-unresolved
spec:
  description: |
    Asserts that a VariableSet with a secretKeyRef whose Secret
    exists but does not contain the referenced key reaches
    phase=Failed with reason=KeyNotFound (not ResourceNotFound).
  steps:
  - try:
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: shape-shifted
          type: Opaque
          stringData:
            other-key: some-value
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: VariableSet
          metadata:
            name: missing-key-vs
          spec:
            variables:
              - name: db_admin_password
                valueFrom:
                  secretKeyRef:
                    name: shape-shifted
                    key: password
    - assert:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: VariableSet
          metadata:
            name: missing-key-vs
          status:
            phase: Failed
            unresolvedReferences:
            - variable: db_admin_password
              kind: Secret
              name: shape-shifted
              key: password
              reason: KeyNotFound
