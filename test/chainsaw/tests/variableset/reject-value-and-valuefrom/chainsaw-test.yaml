apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reject-value-and-valuefrom
spec:
  description: |
    Asserts that the API server rejects a VariableSet whose
    variable sets both value and valueFrom.
  steps:
  - try:
    - apply:
        resource:
          apiVersion: magosproject.io/v1alpha1
          kind: VariableSet
          metadata:
            name: both-set
          spec:
            variables:
              - name: region
                value: us-east-1
                valueFrom:
                  secretKeyRef:
                    name: anything
                    key: region
        expect:
        - match:
            apiVersion: magosproject.io/v1alpha1
            kind: VariableSet
          check:
            ($error != null): true
