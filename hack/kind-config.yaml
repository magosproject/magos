kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # Expose the local chart's NodePort services on stable localhost ports.
  # This lets `make run` talk to RustFS and PostgreSQL without managing
  # long-lived kubectl port-forward processes that are less resilient.
  extraPortMappings:
  - containerPort: 31900
    hostPort: 9000
    protocol: TCP
  - containerPort: 31432
    hostPort: 15432
    protocol: TCP
