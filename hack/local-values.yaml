# Local development chart overlay.
#
# `make run` starts the API, UI, and controllers from the host, so the
# component enabled flags below are disabled. Chart installs should keep
# those components enabled and should use this file only for the local
# developer setup.
api:
  enabled: false

ui:
  enabled: false

controllers:
  workspace:
    enabled: false
  project:
    enabled: false
  rollout:
    enabled: false
  variableset:
    enabled: false
  refwatcher:
    enabled: false

logs:
  storage:
    embedded:
      secret:
        name: magos-dev-rustfs
      service:
        type: NodePort
        nodePort: 31900
      persistence:
        size: 1Gi

postgres:
  embedded:
    auth:
      secret:
        name: magos-dev-postgres
    service:
      type: NodePort
      nodePort: 31432
