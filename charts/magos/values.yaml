## @section Controllers Parameters
## @descriptionStart
## Magos ships five controllers: workspace, project, rollout, variableset, and
## refwatcher. All five share the same configuration shape (enabled, replicas,
## labels, annotations, podLabels, podAnnotations, serviceAccount, env, envFrom,
## resources, nodeSelector, tolerations, affinity, priorityClassName,
## securityContext, containerSecurityContext, probes, cabundle).
##
## The refwatcher controller has three additional fields:
## - defaultPollInterval: how often to poll remote Git refs (default 30s)
## - workerCount: number of concurrent polling workers (default 20)
## - workQueueSize: size of the work queue (default 200)
##
## Only controllers.workspace is annotated in full below. The other four
## controllers follow an identical shape and are skipped.
## @descriptionEnd

controllers:
  workspace:
    ## @param controllers.workspace.enabled Deploy the workspace controller
    enabled: true
    ## @param controllers.workspace.replicas Number of workspace controller replicas
    replicas: 1
    ## @param controllers.workspace.labels Extra labels for the workspace controller Deployment
    labels: {}
    ## @param controllers.workspace.annotations Extra annotations for the workspace controller Deployment
    annotations: {}
    ## @param controllers.workspace.podLabels Extra labels for workspace controller pods
    podLabels: {}
    ## @param controllers.workspace.podAnnotations Extra annotations for workspace controller pods
    podAnnotations: {}
    ## @skip controllers.workspace.serviceAccount
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      labels: {}
      name: ""
    ## @param controllers.workspace.env Additional environment variables for the workspace controller container
    env: []
    ## @param controllers.workspace.envFrom Additional environment variable sources for the workspace controller container
    envFrom: []
    ## @skip controllers.workspace.resources
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ## @param controllers.workspace.nodeSelector Node selector for workspace controller pods
    nodeSelector: {}
    ## @param controllers.workspace.tolerations Tolerations for workspace controller pods
    tolerations: []
    ## @param controllers.workspace.affinity Affinity rules for workspace controller pods
    affinity: {}
    ## @skip controllers.workspace.priorityClassName
