  labels: {}
  ## @param ui.annotations Extra annotations for the UI Deployment
  annotations: {}
  ## @param ui.podLabels Extra labels for UI pods
  podLabels: {}
  ## @param ui.podAnnotations Extra annotations for UI pods
  podAnnotations: {}
  ## @skip ui.serviceAccount
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    labels: {}
    name: ""
  ## @param ui.env Additional environment variables for the UI container
  env: []
  ## @param ui.envFrom Additional environment variable sources for the UI container
  envFrom: []
  ## @skip ui.resources
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi
  ## @param ui.nodeSelector Node selector for UI pods
  nodeSelector: {}
  ## @param ui.tolerations Tolerations for UI pods
  tolerations: []
  ## @param ui.affinity Affinity rules for UI pods
  affinity: {}
  ## @skip ui.priorityClassName
  # priorityClassName:
