    ## @skip auth.secret.name
    name: ""
    sessionSigningKeyKey: sessionSigningKey
    internalTokenKey: internalToken
    adminPasswordHashKey: adminPasswordHash
  ## @skip auth.session
  session:
    ttl: 24h
    cookieSecure: false
    allowedOrigins: []
  admin:
    ## @param auth.admin.enabled Enable the built-in `admin` account. Convenient for development but should be disabled in production in favour of OIDC (`auth.oidc.enabled=true`).
