## @section Global Parameters
## @descriptionStart
## These values apply to all components as defaults. Per-component values take
## precedence when set. All pod scheduling fields (nodeSelector, tolerations,
## affinity, priorityClassName) fall back to the global value when the
## component-level field is empty.
## @descriptionEnd

global:
  ## @param global.labels Labels to add to all resources
  labels: {}
  ## @param global.annotations Annotations to add to all resources
  annotations: {}
  ## @param global.podLabels Labels to add to all pods
  podLabels: {}
  ## @param global.podAnnotations Annotations to add to all pods
  podAnnotations: {}
  ## @param global.env Environment variables to add to all Magos pods
  env: []
  ## @param global.envFrom Environment variables sourced from ConfigMaps or Secrets for all Magos pods
  envFrom: []
  ## @param global.nodeSelector Default node selector for all Magos pods
  nodeSelector: {}
  ## @param global.tolerations Default tolerations for all Magos pods
  tolerations: []
  ## @param global.affinity Default affinity rules for all Magos pods
  affinity: {}
  ## @skip global.priorityClassName
  # priorityClassName:
  ## @skip global.securityContext
  securityContext: {}
  ## @skip global.containerSecurityContext
  containerSecurityContext: {}

