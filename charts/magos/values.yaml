  image:
    repository: ghcr.io/magosproject/magos/ui
    tag: ""
    pullPolicy: IfNotPresent
  ## @skip ui.service
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  ## @skip ui.ingress
  ingress:
    enabled: false
    annotations: {}
    ingressClassName:
    pathType: ImplementationSpecific
    tls:
      enabled: true
      selfSignedCert: true
