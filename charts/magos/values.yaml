image:
  repository: ghcr.io/magosproject/magos/controller
  pullPolicy: IfNotPresent
  tag: ""

jobImage:
  repository: ghcr.io/magosproject/magos/job
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

rbac:
  create: true

crds:
  install: true
  # Annotate CRDs with `helm.sh/resource-policy: keep` so `helm uninstall`
  # does not delete them (and every CR of that kind).
  keep: true

podDefaults:
  annotations: {}
  labels: {}
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

healthProbe:
  port: 8081
  livenessPath: /healthz
  readinessPath: /readyz

metricsService:
  enabled: false
  port: 8080
  type: ClusterIP
  secure: false

leaderElection:
  enabled: true

# Controller enabled flags are only intended for the host-run local development
# setup in hack/local-values.yaml. Normal chart installs should leave all
# controllers enabled.
controllers:
  workspace:
    enabled: true
    replicaCount: 1
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  project:
    enabled: true
    replicaCount: 1
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  rollout:
    enabled: true
    replicaCount: 1
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  variableset:
    enabled: true
    replicaCount: 1
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  refwatcher:
    enabled: true
    replicaCount: 1
    defaultPollInterval: 30s
    workerCount: 20
    workQueueSize: 200
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

# This enabled flag is only intended for the host-run local development setup in
# hack/local-values.yaml. Normal chart installs should leave the UI enabled.
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/magosproject/magos/ui
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi

jobServiceAccount:
  # When true, create a ServiceAccount in the release namespace plus a
  # ClusterRole and ClusterRoleBinding that grant it read access to
  # policies.kyverno.io ValidatingPolicy resources. Workspaces in the release
  # namespace can then set spec.serviceAccountName to this name and policy
  # validation will work out of the box. Workspaces in other namespaces need to
  # bring their own ServiceAccount or replicate this setup.
  create: true
  name: magos-job
  annotations: {}
  automount: true

job:
  # colorOutput controls whether Terraform output includes ANSI colour codes.
  # When true (default) plan and apply output is rendered with colour in the
  # Magos UI. Set to false to produce plain-text output (sets NO_COLOR=1 on
  # the workspace controller, which forwards it to every job pod).
  colorOutput: true
  # Resources applied to Terraform plan/apply job pods launched by the
  # workspace controller. Keep requests and limits set so these pods do not run
  # as BestEffort and become the first eviction target during node pressure.
  resources:
    requests:
      cpu: 125m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

workspace:
  # defaultPVCSize is used when a Workspace does not set spec.pvcSize.
  defaultPVCSize: 1Gi

logs:
  storage:
    # Select how Magos reaches the S3-compatible log backend.
    # - embedded: deploy the bundled RustFS instance and wire it automatically.
    # - external: use your own S3-compatible backend and provide its endpoint
    #   plus a Secret with access key and secret key.
    mode: embedded
    image:
      repository: rustfs/rustfs
      tag: latest
      pullPolicy: IfNotPresent
    auth:
      accessKey: "" # Leave empty to generate and preserve a release-scoped key.
      secretKey: "" # Leave empty to generate and preserve a release-scoped key.
    service:
      type: ClusterIP
      port: 9000
      consolePort: 9001
      # nodePort: "" # Only used when type is NodePort.
      # consoleNodePort: "" # Only used when type is NodePort.
    persistence:
      size: 10Gi
      # storageClass: "" # Leave empty to use the cluster default.
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    external:
      # Required when mode=external.
      endpoint: ""
      # Secret containing the S3 credentials for the external backend.
      # Required when mode=external.
      existingSecret: ""
      accessKeyKey: accessKey
      secretKeyKey: secretKey

postgres:
  # Select how Magos reaches the PostgreSQL database used for run metadata.
  # - embedded: deploy the bundled PostgreSQL instance and wire it automatically.
  # - external: use your own PostgreSQL instance and provide its connection
  #   details plus a Secret with the password.
  mode: embedded
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: magos
    username: magos
    # password: "" # Leave empty to generate and preserve a release-scoped password.
    existingSecret: ""
    passwordKey: password
  service:
    type: ClusterIP
    port: 5432
    # nodePort: "" # Only used when type is NodePort.
  sslMode: disable
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: "" # Leave empty to use the cluster default.
  external:
    # Required when mode=external.
    host: ""
    port: 5432
    database: magos
    username: magos
    # Secret containing the password for the external PostgreSQL user.
    # Required when mode=external.
    existingSecret: ""
    passwordKey: password
    sslMode: disable
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
      - ALL
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

policy:
  kyverno:
    # Install the policies.kyverno.io ValidatingPolicy CRD. The magos job reads
    # this CRD at plan time to evaluate policies against the terraform plan. Set
    # to false when the ValidatingPolicy CRD is already installed in the cluster
    # (for example through the upstream chart) so the CRD has a single owner.
    installCRD: true

# This enabled flag is only intended for the host-run local development setup in
# hack/local-values.yaml. Normal chart installs should leave the API enabled.
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/magosproject/magos/api
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  env: []
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
