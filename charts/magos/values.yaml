## @section Postgres Parameters
## @descriptionStart
## Set `postgres.mode` to `embedded` (default) to deploy a PostgreSQL
## StatefulSet managed by this chart, or to `external` to point at a
## pre-existing PostgreSQL instance.
##
## When using embedded mode, the chart auto-generates a random password on
## first install and preserves it across upgrades. For production workloads,
## set `postgres.embedded.auth.secret.name` to a Secret you manage.
## @descriptionEnd

postgres:
  ## @param postgres.mode Postgres deployment mode. Either `embedded` (chart-managed) or `external`
  mode: embedded
  embedded:
    ## @skip postgres.embedded.image
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    ## @skip postgres.embedded.auth
    auth:
      database: magos
      username: magos
      secret:
        # When secret.name is empty, the chart renders a Secret named
        # "<release>-postgres" with a random password on first install and
        # preserves it across upgrades. For production set secret.name to a
        # Secret you manage yourself.
        name: ""
        passwordKey: password
    ## @skip postgres.embedded.service
    service:
      type: ClusterIP
      port: 5432
      # nodePort:
    ## @param postgres.embedded.sslMode SSL mode passed to Postgres clients (disable, require, verify-full, etc.)
    sslMode: disable
    ## @skip postgres.embedded.persistence
    persistence:
      enabled: true
      size: 10Gi
      # storageClass:
    ## @skip postgres.embedded.resources
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    ## @skip postgres.embedded.podSecurityContext
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      seccompProfile:
        type: RuntimeDefault
    ## @skip postgres.embedded.containerSecurityContext
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop: [ALL]
    ## @param postgres.embedded.nodeSelector Node selector for the embedded Postgres pod
    nodeSelector: {}
    ## @param postgres.embedded.tolerations Tolerations for the embedded Postgres pod
    tolerations: []
    ## @param postgres.embedded.affinity Affinity rules for the embedded Postgres pod
    affinity: {}
    ## @skip postgres.embedded.priorityClassName
    # priorityClassName:
  external:
    ## @param postgres.external.host Hostname or IP address of the external Postgres server
    host: ""
    ## @param postgres.external.port Port of the external Postgres server
    port: 5432
    ## @param postgres.external.database Database name on the external Postgres server
    database: magos
    ## @param postgres.external.username Username for connecting to the external Postgres server
    username: magos
    ## @skip postgres.external.secret
    secret:
      name: ""
      passwordKey: password
    ## @param postgres.external.sslMode SSL mode for external Postgres connections
    sslMode: disable

## @section Logs Storage Parameters
## @descriptionStart
## Set `logs.storage.mode` to `embedded` (default) to deploy RustFS (an
## S3-compatible object store) managed by this chart, or to `external` to
## point at an existing S3-compatible endpoint (AWS S3, GCS, MinIO, etc.).
##
## When using embedded mode, the chart auto-generates random access and secret
## keys on first install and preserves them across upgrades. For production
## workloads, set `logs.storage.embedded.secret.name` to a Secret you manage.
## @descriptionEnd

logs:
  storage:
    ## @param logs.storage.mode Log storage deployment mode. Either `embedded` (chart-managed RustFS) or `external`
    mode: embedded
    embedded:
      ## @skip logs.storage.embedded.image
      image:
        repository: rustfs/rustfs
        tag: latest
        pullPolicy: IfNotPresent
      ## @skip logs.storage.embedded.secret
      secret:
        # When secret.name is empty, the chart renders a Secret named
        # "<release>-rustfs" with random access and secret keys on first
        # install and preserves them across upgrades. For production set
        # secret.name to a Secret you manage yourself.
        name: ""
        accessKeyKey: accessKey
        secretKeyKey: secretKey
      ## @skip logs.storage.embedded.service
      service:
        type: ClusterIP
        port: 9000
        consolePort: 9001
        # nodePort:
        # consoleNodePort:
      ## @skip logs.storage.embedded.persistence
      persistence:
        size: 10Gi
        # storageClass:
      ## @skip logs.storage.embedded.resources
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      ## @skip logs.storage.embedded.podSecurityContext
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      ## @skip logs.storage.embedded.containerSecurityContext
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: [ALL]
      ## @param logs.storage.embedded.nodeSelector Node selector for the embedded RustFS pod
      nodeSelector: {}
      ## @param logs.storage.embedded.tolerations Tolerations for the embedded RustFS pod
      tolerations: []
      ## @param logs.storage.embedded.affinity Affinity rules for the embedded RustFS pod
      affinity: {}
      ## @skip logs.storage.embedded.priorityClassName
      # priorityClassName:
    external:
      ## @param logs.storage.external.endpoint S3-compatible endpoint URL for external log storage
      endpoint: ""
      ## @skip logs.storage.external.secret
      secret:
        name: ""
        accessKeyKey: accessKey
        secretKeyKey: secretKey

