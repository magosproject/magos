    replicas: 1
    labels: {}
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      labels: {}
      name: ""
    env: []
    envFrom: []
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # priorityClassName:
    securityContext: {}
    containerSecurityContext: {}
    probes:
      enabled: true
    cabundle:
      configMapName: ""
      secretName: ""
  ## @skip controllers.rollout
  rollout:
    enabled: true
    replicas: 1
    labels: {}
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    serviceAccount:
      create: true
      automount: true
      annotations: {}
      labels: {}
      name: ""
    env: []
    envFrom: []
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # priorityClassName:
    securityContext: {}
    containerSecurityContext: {}
    probes:
      enabled: true
    cabundle:
      configMapName: ""
      secretName: ""
  ## @skip controllers.variableset
  variableset:
    enabled: true
    replicas: 1
    labels: {}
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    serviceAccount:
      create: true
