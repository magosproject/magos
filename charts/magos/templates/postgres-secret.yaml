{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- $secretName := include "magos.postgresSecretName" . -}}
{{- $passwordKey := include "magos.postgresPasswordKey" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  {{- if $existing }}
  {{- range $key, $value := omit $existing.data "username" "database" $passwordKey }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  username: {{ .Values.postgres.auth.username | b64enc | quote }}
  database: {{ .Values.postgres.auth.database | b64enc | quote }}
  {{ $passwordKey }}: {{ if .Values.postgres.auth.password }}{{ .Values.postgres.auth.password | b64enc | quote }}{{ else if and $existing (index $existing.data $passwordKey) }}{{ index $existing.data $passwordKey | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
