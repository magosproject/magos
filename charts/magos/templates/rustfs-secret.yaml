{{- $secretName := printf "%s-rustfs" (include "magos.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
type: Opaque
data:
  {{- if $existing }}
  {{- range $key, $value := omit $existing.data "accessKey" "secretKey" }}
  {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
  accessKey: {{ if and $existing (index $existing.data "accessKey") }}{{ index $existing.data "accessKey" }}{{ else }}{{ randAlphaNum 20 | b64enc }}{{ end }}
  secretKey: {{ if and $existing (index $existing.data "secretKey") }}{{ index $existing.data "secretKey" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
