{{- if eq (include "magos.logsStorageMode" .) "embedded" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "magos.rustfsName" . }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  accessModes:
  - ReadWriteOnce
  {{- with .Values.logs.storage.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.logs.storage.persistence.size }}
{{- end }}
