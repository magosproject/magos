{{- include "magos.validate" . -}}
{{- if and .Values.api.enabled .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magos.apiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.api.labels" . | nindent 4 }}
    {{- with (mergeOverwrite (deepCopy (default dict .Values.global.labels)) (.Values.api.serviceAccount.labels | default dict)) }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  {{- include "magos.annotations" (dict "root" . "annotations" .Values.api.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: {{ .Values.api.serviceAccount.automount }}
{{- end }}
