{{- include "magos.validate" . -}}
{{- if and .Values.auth.enabled (not .Values.auth.secret.name) }}
{{- $name := include "magos.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $sessionSigningKey := randAlphaNum 64 -}}
{{- $internalToken := randAlphaNum 64 -}}
{{- $adminPassword := randAlphaNum 24 -}}
{{- $adminPasswordHash := "" -}}
{{- if $existing -}}
{{- with index $existing.data "sessionSigningKey" }}{{- $sessionSigningKey = . | b64dec -}}{{- end -}}
{{- with index $existing.data "internalToken" }}{{- $internalToken = . | b64dec -}}{{- end -}}
{{- with index $existing.data "adminPassword" }}{{- $adminPassword = . | b64dec -}}{{- end -}}
{{- with index $existing.data "adminPasswordHash" }}{{- $adminPasswordHash = . | b64dec -}}{{- end -}}
{{- end -}}
{{- if and .Values.auth.admin.enabled (eq $adminPasswordHash "") -}}
{{- $adminPasswordHash = bcrypt $adminPassword -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  sessionSigningKey: {{ $sessionSigningKey | quote }}
  internalToken: {{ $internalToken | quote }}
  {{- if .Values.auth.admin.enabled }}
  adminPassword: {{ $adminPassword | quote }}
  adminPasswordHash: {{ $adminPasswordHash | quote }}
  {{- end }}
{{- end }}
