{{- include "magos.validate" . -}}
{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magos.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.api.labels" . | nindent 4 }}
  {{- include "magos.annotations" (dict "root" . "annotations" .Values.api.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - name: http
    port: {{ .Values.api.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "magos.selectorLabels" . | nindent 4 }}
    {{- include "magos.api.labels" . | nindent 4 }}
{{- end }}
