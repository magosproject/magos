{{- include "magos.validate" . -}}
{{- if and .Values.rbac.installClusterRoleBindings .Values.job.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "magos.fullname" . }}-job
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.job.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "magos.fullname" . }}-job
subjects:
- kind: ServiceAccount
  name: {{ .Values.job.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
