{{- include "magos.validate" . -}}
{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "magos.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.ui.labels" . | nindent 4 }}
  {{- include "magos.annotations" (dict "root" . "annotations" .Values.ui.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
  - name: http
    port: {{ .Values.ui.service.port }}
    targetPort: http
    protocol: TCP
  {{- if .Values.ui.tls.enabled }}
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  {{- end }}
  selector:
    {{- include "magos.selectorLabels" . | nindent 4 }}
    {{- include "magos.ui.labels" . | nindent 4 }}
{{- end }}
