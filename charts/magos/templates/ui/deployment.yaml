{{- include "magos.validate" . -}}
{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magos.fullname" . }}-ui
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    {{- include "magos.ui.labels" . | nindent 4 }}
    {{- with (mergeOverwrite (deepCopy (default dict .Values.global.labels)) (.Values.ui.labels | default dict)) }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  {{- include "magos.annotations" (dict "root" . "annotations" .Values.ui.annotations) | nindent 2 }}
spec:
  replicas: {{ .Values.ui.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "magos.selectorLabels" . | nindent 6 }}
      {{- include "magos.ui.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "magos.labels" . | nindent 8 }}
        {{- include "magos.ui.labels" . | nindent 8 }}
        {{- with (mergeOverwrite (deepCopy (default dict .Values.global.podLabels)) (.Values.ui.podLabels | default dict)) }}
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- with (mergeOverwrite (deepCopy (default dict .Values.global.podAnnotations)) (.Values.ui.podAnnotations | default dict)) }}
      annotations:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.securityContext | default .Values.global.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ui
        image: {{ include "magos.ui.image" . }}
        imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
        env:
        - name: MAGOS_API_HOST
          value: {{ include "magos.fullname" . }}-api
        - name: MAGOS_API_PORT
          value: "{{ .Values.api.service.port }}"
        - name: MAGOS_TLS_ENABLED
          value: {{ .Values.ui.tls.enabled | quote }}
        {{- with (concat (default list .Values.global.env) (default list .Values.ui.env)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (concat (default list .Values.global.envFrom) (default list .Values.ui.envFrom)) }}
        envFrom:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        {{- if .Values.ui.tls.enabled }}
        - containerPort: 443
          name: https
          protocol: TCP
        {{- end }}
        {{- with .Values.ui.containerSecurityContext | default .Values.global.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.ui.probes.enabled }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- end }}
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        {{- if .Values.ui.tls.enabled }}
        - name: tls
          mountPath: /etc/magos/tls
          readOnly: true
        {{- end }}
      {{- with .Values.ui.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity | default .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.priorityClassName | default .Values.global.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- if .Values.ui.tls.enabled }}
      - name: tls
        secret:
          secretName: {{ .Values.ui.tls.secretName }}
      {{- end }}
{{- end }}
