{{- if and .Values.api.enabled .Values.logs.enabled .Values.logs.summaries.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-api-logs" (include "magos.fullname" .) }}
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes:
  - ReadWriteOnce
  {{- with .Values.logs.summaries.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.logs.summaries.persistence.size }}
{{- end }}
