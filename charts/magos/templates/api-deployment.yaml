{{- if .Values.api.enabled }}
{{- if and .Values.logs.enabled (gt (int .Values.api.replicaCount) 1) }}
{{- fail "api.replicaCount must be 1 when logs.enabled is true because the API owns a SQLite database on a persistent volume" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "magos.fullname" . }}-api
  labels:
    {{- include "magos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  {{- if .Values.logs.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "magos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "magos.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "magos.apiServiceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- include "magos.logstoreEnv" . | nindent 8 }}
        {{- if .Values.logs.enabled }}
        - name: MAGOS_SQLITE_PATH
          value: {{ printf "%s/magos.db" .Values.sqlite.mountPath | quote }}
        {{- end }}
        {{- with .Values.api.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.podDefaults.containerSecurityContext | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        {{- if .Values.logs.enabled }}
        volumeMounts:
        - name: sqlite-data
          mountPath: {{ .Values.sqlite.mountPath | quote }}
        {{- end }}
      {{- if .Values.logs.enabled }}
      volumes:
      - name: sqlite-data
        {{- if .Values.sqlite.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ printf "%s-api-sqlite" (include "magos.fullname" .) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
